spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  h2:
    console:
      enabled: true

# JWT configuration for tests (valid Base64 key)
jwt:
  secret: "dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktdmFsaWQtYmFzZTY0LWtleQ=="
  expiration: 3600000
