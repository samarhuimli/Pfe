<div class="page-container">
  <div class="header-section">
    <div class="header-content">
      <div class="icon-wrapper">
        <svg class="user-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="header-text">
        <h1>Creer un utilisateur</h1>
        <p>Créez un nouveau compte utilisateur avec les informations requises</p>

      </div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div class="toast-container">
    <div class="toast success-toast" [class.show]="showSuccessToast" *ngIf="showSuccessToast">
      <div class="toast-content">
        <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M20 6L9 17l-5-5"></path>
        </svg>
        <span class="toast-message">{{ toastMessage }}</span>
        <button class="toast-close" (click)="hideToasts()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="toast error-toast" [class.show]="showErrorToast" *ngIf="showErrorToast">
      <div class="toast-content">
        <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <span class="toast-message">{{ toastMessage }}</span>
        <button class="toast-close" (click)="hideToasts()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="form-container">
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="modern-form">
      <div class="form-grid">
        <!-- Informations personnelles -->
        <div class="form-section">
          <h3 class="section-title">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Informations personnelles
          </h3>
          
          <div class="input-group">
            <label for="name">Nom complet</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input 
                id="name"
                type="text" 
                formControlName="username" 
                placeholder="Entrez le nom complet"
                [class.error]="userForm.get('username')?.invalid && userForm.get('username')?.touched"
              />
            </div>
            <div class="error-message" *ngIf="userForm.get('username')?.invalid && userForm.get('username')?.touched">
              <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
              </svg>
              Le nom est obligatoire
            </div>
          </div>

          <div class="input-group">
            <label for="email">Adresse email</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input 
                id="email"
                type="email" 
                formControlName="email" 
                placeholder="exemple@domaine.com"
                [class.error]="userForm.get('email')?.invalid && userForm.get('email')?.touched"
              />
            </div>
            <div class="error-message" *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched">
              <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
              </svg>
              Entrez une adresse email valide
            </div>
          </div>
        </div>

        <!-- Configuration du compte -->
        <div class="form-section">
          <h3 class="section-title">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <circle cx="12" cy="16" r="1"></circle>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Configuration du compte
          </h3>

          <div class="select-grid">
            <div class="input-group">
              <label for="role">Rôle</label>
              <div class="select-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="8.5" cy="7" r="4"></circle>
                  <path d="M20 8v6M23 11h-6"></path>
                </svg>
                <select id="role" formControlName="role">
                  <option value="ROLE_ADMIN">👑 Administrateur</option>
                  <option value="ROLE_SCIENTIST">👤 Scientifique</option>
                  <option value="ROLE_ANALYSTE">🛡️ Analyste</option>
                </select>
                <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <polyline points="6,9 12,15 18,9"></polyline>
                </svg>
              </div>
            </div>

            <div class="input-group">
              <label for="status">Statut</label>
              <div class="select-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M9,12l2,2 4,-4"></path>
                </svg>
                <select id="status" formControlName="enabled">
                  <option [value]="true">🟢 Actif</option>
                  <option [value]="false">🔴 Inactif</option>
                </select>
                <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <polyline points="6,9 12,15 18,9"></polyline>
                </svg>
              </div>
            </div>
          </div>

          <div class="input-group">
            <label for="password">Mot de passe</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <circle cx="12" cy="16" r="1"></circle>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input 
                id="password"
                type="password" 
                formControlName="password"
                placeholder="Entrez le mot de passe"
                [class.error]="userForm.get('password')?.invalid && userForm.get('password')?.touched"
              />
            </div>
            <div class="error-message" *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched">
              <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
              </svg>
              Le mot de passe est obligatoire
            </div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button type="button" class="cancel-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          Annuler
        </button>
        <button type="submit" [disabled]="userForm.invalid || isSubmitting" class="submit-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" *ngIf="!isSubmitting">
            <path d="M20 6L9 17l-5-5"></path>
          </svg>
          <svg class="btn-icon spinning" viewBox="0 0 24 24" fill="none" stroke="currentColor" *ngIf="isSubmitting">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 6v6l4 2"></path>
          </svg>
          {{ isSubmitting ? 'Création en cours...' : 'Créer l\'utilisateur' }}
        </button>
      </div>
    </form>
  </div>
</div>
