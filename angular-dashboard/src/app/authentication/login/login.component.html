<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="auth-header">
        <a href="javascript:"><img src="assets/images/image.png" alt="logo" /></a>
      </div>
      <div class="card my-5">
        <div class="card-body">
          <div class="d-flex justify-content-center align-items-end mb-4">
            <h3 class="mb-0"><b>Connexion</b></h3>
          </div>
          
          <!-- Toast Notification -->
          <div *ngIf="toast.show" class="alert alert-dismissible fade show mb-3" 
               [ngClass]="{
                 'alert-success': toast.type === 'success',
                 'alert-danger': toast.type === 'error',
                 'alert-warning': toast.type === 'warning',
                 'alert-info': toast.type === 'info'
               }" 
               role="alert">
            <i class="fas" 
               [ngClass]="{
                 'fa-check-circle': toast.type === 'success',
                 'fa-exclamation-circle': toast.type === 'error',
                 'fa-exclamation-triangle': toast.type === 'warning',
                 'fa-info-circle': toast.type === 'info'
               }"></i>
            {{ toast.message }}
            <button type="button" class="btn-close" (click)="closeToast()" aria-label="Close"></button>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
            <div class="form-group mb-3">
              <label class="form-label" for="username">Nom d'utilisateur</label>
              <input 
                type="text" 
                class="form-control" 
                id="username"
                formControlName="username"
                placeholder="Nom d'utilisateur"
                [class.is-invalid]="username?.invalid && username?.touched"
                [class.is-valid]="username?.valid && username?.touched" />
              <div *ngIf="username?.invalid && username?.touched" class="invalid-feedback">
                <div *ngIf="username?.errors?.['required']">Le nom d'utilisateur est requis</div>
              </div>
            </div>
            
            <div class="form-group mb-3">
              <label class="form-label" for="password">Mot de passe</label>
              <input 
                type="password" 
                class="form-control" 
                id="password"
                formControlName="password"
                placeholder="Mot de passe"
                [class.is-invalid]="password?.invalid && password?.touched"
                [class.is-valid]="password?.valid && password?.touched" />
              <div *ngIf="password?.invalid && password?.touched" class="invalid-feedback">
                <div *ngIf="password?.errors?.['required']">Le mot de passe est requis</div>
                <div *ngIf="password?.errors?.['minlength']">Le mot de passe doit contenir au moins 6 caractères</div>
              </div>
            </div>
            
            <div class="d-flex mt-1 justify-content-between">
              <div class="form-check">
                <input 
                  class="form-check-input input-primary" 
                  type="checkbox" 
                  id="rememberMe"
                  formControlName="rememberMe" />
                <label class="form-check-label text-muted" for="rememberMe">Rester connecté</label>
              </div>
              <h5 class="text-secondary f-w-400"><a href="javascript:">Mot de passe oublié ?</a></h5>
            </div>
            
            <div class="d-grid mt-4">
              <button 
                type="submit" 
                class="btn btn-primary"
                [disabled]="isLoading">
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                <span *ngIf="isLoading">Connexion en cours...</span>
                <span *ngIf="!isLoading">Se connecter</span>
              </button>
            </div>
          </form>
          
          <div class="saprator mt-3">
          </div>
        </div>
      </div>
      <div class="auth-footer row">
        <div class="col my-1">
          <p class="m-0">
            Copyright 
            <a href="https://codedthemes.com/" target="_blank">CodedThemes</a>
          </p>
        </div>
        <div class="col-auto my-1">
          <ul class="list-inline footer-link mb-0">
            <li class="list-inline-item"><a href="https://codedthemes.com/" target="_blank">Accueil</a></li>
            <li class="list-inline-item"><a href="https://codedthemes.com/privacy-policy/" target="_blank">Politique de confidentialité</a></li>
            <li class="list-inline-item"><a href="https://codedthemes.support-hub.io/" target="_blank">Contactez-nous</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
