<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="auth-header">
        <a href="javascript:"><img src="assets/images/image.png" alt="logo" /></a>
      </div>
      <div class="card my-5">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-end mb-4">
            <h3 class="mb-0"><b>Connexion</b></h3>
            <a [routerLink]="['/register']" class="link-primary">Vous n’avez pas de compte ?</a>
          </div>
          <div class="form-group mb-3">
            <label class="form-label" for="email">Adresse e-mail</label>
            <input type="email" class="form-control" id="email" placeholder="Adresse e-mail" value="info@codedthemes.com" />
          </div>
          <div class="form-group mb-3">
            <label class="form-label" for="password">Mot de passe</label>
            <input type="password" class="form-control" id="password" placeholder="Mot de passe" value="123456789" />
          </div>
          <div class="d-flex mt-1 justify-content-between">
            <div class="form-check">
              <input class="form-check-input input-primary" type="checkbox" id="customCheckc1" checked="" />
              <label class="form-check-label text-muted" for="customCheckc1">Rester connecté</label>
            </div>
            <h5 class="text-secondary f-w-400"><a href="javascript:">Mot de passe oublié ?</a></h5>
          </div>
          <div class="d-grid mt-4">
            <a class="btn btn-primary" routerLink="/scripts">Se connecter</a>
          </div>
          <div class="saprator mt-3">
          </div>
        </div>
      </div>
      <div class="auth-footer row">
        <div class="col my-1">
          <p class="m-0">
            Copyright ©
            <a href="https://codedthemes.com/" target="_blank">CodedThemes</a>
          </p>
        </div>
        <div class="col-auto my-1">
          <ul class="list-inline footer-link mb-0">
            <li class="list-inline-item"><a href="https://codedthemes.com/" target="_blank">Accueil</a></li>
            <li class="list-inline-item"><a href="https://codedthemes.com/privacy-policy/" target="_blank">Politique de confidentialité</a></li>
            <li class="list-inline-item"><a href="https://codedthemes.support-hub.io/" target="_blank">Contactez-nous</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
