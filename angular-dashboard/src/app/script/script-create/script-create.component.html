<div class="container">
  <div class="card">
    <div class="card-header">
      {{ isEdit ? 'Modifier le Script' : 'Créer un Script' }}
    </div>
    <div class="card-body">
      <form (ngSubmit)="submitForm(scriptForm)" #scriptForm="ngForm" class="row g-3">
        <div class="col-md-6">
          <label for="title" class="form-label">Titre</label>
          <input type="text" class="form-control" id="title" [(ngModel)]="form.title" name="title" required #title="ngModel">
          <div *ngIf="title.invalid && (title.dirty || title.touched)" class="text-danger">
            Le titre est requis
          </div>
        </div>

        <div class="col-md-6">
          <label for="createdBy" class="form-label">Créé par</label>
          <input type="text" class="form-control" id="createdBy" [(ngModel)]="form.createdBy" name="createdBy" required #createdBy="ngModel">
          <div *ngIf="createdBy.invalid && (createdBy.dirty || createdBy.touched)" class="text-danger">
            Le créateur est requis
          </div>
        </div>

        <div class="col-md-6">
          <label for="type" class="form-label">Type de script</label>
          <select id="type" class="form-select" [(ngModel)]="form.type" name="type" required #type="ngModel">
            <option value="">Sélectionnez un type</option>
            <option value="PYTHON">Python</option>
            <option value="R">R</option>
            <option value="SQL">SQL</option>
          </select>
          <div *ngIf="type.invalid && (type.dirty || type.touched)" class="text-danger">
            Le type est requis
          </div>
        </div>

        <div class="col-12">
          <div class="editor-container">
            <div class="editor-header">
              <div class="editor-tabs">
                <div class="editor-tab active">
                  <i class="fas fa-file-code"></i>
                  <span>{{ form.title || 'Untitled' }}.{{ form.type === 'R' ? 'R' : 'py' }}</span>
                </div>
              </div>
              <div class="editor-actions">
                <button type="button" class="editor-btn" (click)="runCode()" [disabled]="isRunning || !form.content || !form.type" title="Exécuter">
                  <i class="fas fa-play" *ngIf="!isRunning"></i>
                  <i class="fas fa-spinner fa-spin" *ngIf="isRunning"></i>
                </button>
                <button *ngIf="form.type === 'PYTHON'" type="button" class="editor-btn" (click)="analyzePythonScript()" [disabled]="!form.content || analysisLoading" title="Analyser Python">
                  <i class="fas fa-shield-alt" *ngIf="!analysisLoading"></i>
                  <i class="fas fa-spinner fa-spin" *ngIf="analysisLoading"></i>
                </button>
                <button *ngIf="form.type === 'R'" type="button" class="editor-btn" (click)="analyzeRScript()" [disabled]="!form.content || analysisLoading" title="Analyser R">
                  <i class="fas fa-shield-alt" *ngIf="!analysisLoading"></i>
                  <i class="fas fa-spinner fa-spin" *ngIf="analysisLoading"></i>
                </button>
                <div class="editor-divider"></div>
                <button type="button" class="editor-btn" (click)="saveToFile()" [disabled]="!form.content" title="Télécharger">
                  <i class="fas fa-download"></i>
                </button>
                <button type="button" class="editor-btn" (click)="clearEditor()" title="Effacer">
                  <i class="fas fa-trash"></i>
                </button>
                <div class="editor-divider"></div>
                <button type="button" class="editor-btn" title="Format Code">
                  <i class="fas fa-indent"></i>
                </button>
                <button type="button" class="editor-btn" title="Settings">
                  <i class="fas fa-cog"></i>
                </button>
              </div>
            </div>
            <div class="editor-body">
              <div class="line-numbers" id="lineNumbers"></div>
              <textarea 
                id="content" 
                class="form-control code-editor" 
                [(ngModel)]="form.content" 
                name="content" 
                rows="15" 
                required 
                #content="ngModel"
                placeholder="# Start typing your code here..."
                (input)="updateLineNumbers()"
                (scroll)="syncScroll($event)">
              </textarea>
            </div>
          </div>
          <div *ngIf="content.invalid && (content.dirty || content.touched)" class="text-danger">
            Le contenu est requis
          </div>
        </div>

        <div class="col-12" *ngIf="analysisResult">
          <div class="alert alert-info pre-scrollable" style="white-space: pre-wrap;">
            {{ analysisResult }}
          </div>
        </div>


        <!-- Résultats d'exécution -->
<div class="col-12" *ngIf="output">
  <div class="output-panel" [class.error]="output.includes('Erreur:')" [class.success]="!output.includes('Erreur:')">
    <app-execution-result
      [success]="!output.includes('Erreur:')"
      [output]="output"
      [error]="output.includes('Erreur:') ? output : ''"
      [createdBy]="form.createdBy"
      [date]="currentDate">
    </app-execution-result>
  </div>
</div>
        <!-- Boutons de soumission -->
        <div class="col-12 d-flex justify-content-end gap-3 mt-4">
          <button type="button" class="btn btn-secondary" (click)="cancel()">
  <i class="bi bi-x-circle"></i> Annuler
</button>
          <button type="submit" class="btn btn-primary" [disabled]="scriptForm.invalid">
            <i class="bi bi-save"></i> {{ isEdit ? 'Mettre à jour' : 'Enregistrer' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
